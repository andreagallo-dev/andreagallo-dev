<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Andrea Gallo - Robotics and Embedded Systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f1b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <path id="route" d="M720 130 C790 40 860 40 900 110 S1010 190 1080 110 S1170 50 1230 100"/>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="760" height="320" fill="url(#fade)"/>

  <!-- left: text -->
  <text x="64" y="92" font-family="'Fira Code','SFMono-Regular',Consolas,monospace" font-size="14" letter-spacing="3" fill="#58a6ff">ROS 2  ·  NAV2  ·  RISC-V  ·  FPGA</text>
  <text x="64" y="160" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#ffffff">Andrea Gallo</text>
  <text x="64" y="204" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#58a6ff">Robotics &amp; Embedded Systems</text>
  <text x="64" y="240" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8b949e">Automation Engineering graduate  ·  University of Bologna</text>

  <!-- right top: waypoint navigation -->
  <text x="720" y="36" font-family="'Fira Code',Consolas,monospace" font-size="12" letter-spacing="2" fill="#8b949e">WAYPOINT NAVIGATION</text>
  <use xlink:href="#route" href="#route" fill="none" stroke="#2f81f7" stroke-width="2" stroke-opacity="0.9" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.5s" repeatCount="indefinite"/>
  </use>
  <g fill="#0d1117" stroke="#3fb950" stroke-width="2">
    <circle cx="720" cy="130" r="7"/>
    <circle cx="900" cy="110" r="7"/>
    <circle cx="1080" cy="110" r="7"/>
    <circle cx="1230" cy="100" r="7"/>
  </g>
  <circle r="14" fill="#2f81f7" fill-opacity="0.25">
    <animateMotion dur="9s" repeatCount="indefinite"><mpath xlink:href="#route" href="#route"/></animateMotion>
  </circle>
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="9s" repeatCount="indefinite"><mpath xlink:href="#route" href="#route"/></animateMotion>
  </circle>

  <!-- right bottom: 5-stage pipeline -->
  <text x="740" y="212" font-family="'Fira Code',Consolas,monospace" font-size="12" letter-spacing="2" fill="#8b949e">5-STAGE PIPELINE</text>
  <g stroke="#30363d" stroke-width="2">
    <line x1="824" y1="251" x2="838" y2="251"/>
    <line x1="922" y1="251" x2="936" y2="251"/>
    <line x1="1020" y1="251" x2="1034" y2="251"/>
    <line x1="1118" y1="251" x2="1132" y2="251"/>
  </g>
  <g font-family="'Fira Code',Consolas,monospace" font-size="15" font-weight="600" text-anchor="middle" fill="#c9d1d9">
    <rect x="740" y="230" width="84" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="fill" values="#161b22;#1f6feb;#161b22;#161b22" keyTimes="0;0.1;0.2;1" dur="5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="782" y="257">IF</text>
    <rect x="838" y="230" width="84" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="fill" values="#161b22;#1f6feb;#161b22;#161b22" keyTimes="0;0.1;0.2;1" dur="5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="880" y="257">ID</text>
    <rect x="936" y="230" width="84" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="fill" values="#161b22;#1f6feb;#161b22;#161b22" keyTimes="0;0.1;0.2;1" dur="5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="978" y="257">EX</text>
    <rect x="1034" y="230" width="84" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="fill" values="#161b22;#1f6feb;#161b22;#161b22" keyTimes="0;0.1;0.2;1" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="1076" y="257">MEM</text>
    <rect x="1132" y="230" width="84" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="fill" values="#161b22;#1f6feb;#161b22;#161b22" keyTimes="0;0.1;0.2;1" dur="5s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="1174" y="257">WB</text>
  </g>
</svg>
